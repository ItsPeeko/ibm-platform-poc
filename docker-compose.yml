version: '3.8'
services:
  # Initial backend service (v1)
  backend:
    build:
      context: ./backend
    container_name: backend
    environment:
      - VERSION=v1

  # Uncomment the following to simulate upgrade process (v2)
  # backend-v2:
  #   build:
  #     context: ./backend-v2
  #   container_name: backend-v2
  #   environment:
  #     - VERSION=v2

  frontend:
    build:
      context: ./frontend
    container_name: frontend

  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      # - backend-v2
      - frontend
